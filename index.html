<header><h1>Using Disjoint Sets to Generate Random Mazes</h1></header>
<main>
<form class="toolbar" id="settings"><label><span class="fira-label">Rows</span> <input id="rows" type="number" min="2" max="25" value="6" required></label><label><span class="fira-label">Columns</span> <input id="cols" type="number" min="2" max="25" value="8" required></label><button id="generate" type="button">Generate Grid</button><button class="primary" id="reset" type="button">Reset</button><div class="maze-actions" role="group" aria-label="Maze controls"><button type="button" id="back" title="Undo the previous wall consideration">Previous Wall</button><button type="button" id="play" class="primary">▶ Play</button><button type="button" id="wall">Next Wall</button><button type="button" id="finish">Finish</button><button type="button" id="bfs" disabled aria-pressed="false" title="Show the complete entrance-to-exit path using breadth-first search">Find Path using BFS</button></div></form>
<div class="layout"><section class="card maze-card"><div class="board"><div class="maze-wrap"><canvas id="maze" role="img" aria-label="Maze grid. START is above cell 1; END is below the last cell. Cells are numbered from 1 in row order."></canvas><div id="cellLabels" class="cell-labels" aria-hidden="true"></div><div id="robot" class="path-robot" role="img" aria-label="Robot following the solution path" hidden><svg viewBox="0 0 40 44" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M20 3v6" stroke="#172e3b" stroke-width="3"/><circle cx="20" cy="3" r="3" fill="#ef4444"/><rect x="5" y="9" width="30" height="24" rx="7" fill="#f8fafc" stroke="#172e3b" stroke-width="2.5"/><rect x="10" y="14" width="20" height="10" rx="4" fill="#164e63"/><circle cx="15" cy="19" r="2" fill="#67e8f9"/><circle class="robot-eye-open" cx="25" cy="19" r="2" fill="#67e8f9"/><path class="robot-wink" d="M22 19q3-4 6 0" fill="none" stroke="#67e8f9" stroke-width="2" stroke-linecap="round"/><path class="robot-neutral-mouth" d="M15 28h10" stroke="#172e3b" stroke-width="2.5" stroke-linecap="round"/><path class="robot-smile" d="M14 26q6 8 12 0" fill="none" stroke="#172e3b" stroke-width="2.5" stroke-linecap="round"/><path d="M11 34v6m18-6v6M3 17v9m34-9v9" stroke="#172e3b" stroke-width="4" stroke-linecap="round"/></svg></div></div></div>

</section>
<div class="sidebar"><section class="card controls-card" aria-label="Maze controls and counters"><div class="transport"><div class="timeline"><input id="timeline" aria-label="Walls considered" type="range" min="0" value="0"><span id="position" class="hint"></span></div></div>
<div class="operations" aria-label="Disjoint-set operation counters"><div class="operation make-set" title="One MAKE-SET per initial cell"><strong id="makeCount">0</strong><span class="operation-label"># MAKE-SET</span></div><div class="operation find-set" title="Top-level FIND-SET calls; parent traversals and compression assignments are not additional calls"><strong id="findCount">0</strong><span class="operation-label"># FIND-SET</span></div><div class="operation union" title="Successful weighted unions of two different sets"><strong id="unionCount">0</strong><span class="operation-label"># UNION</span></div></div>
<div class="metrics"><div><strong id="setCount"></strong><span class="metric-label"># CURRENT SETS</span></div><div><strong id="wallCount"></strong><span class="metric-label"># WALLS CONSIDERED</span></div></div>

'use strict';
const $=id=>document.getElementById(id);
const mathCache=new Map();
function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fallbackMath(tex){let plain=String(tex),previous;do{previous=plain;plain=plain.replace(/\\(?:textsf|textbf|text|mathrm)\{([^{}]*)\}/g,'$1');}while(plain!==previous);plain=plain.replace(/\\quad/g,' ').replace(/\\ne\b/g,'≠').replace(/\\([{}])/g,'$1');const boldSans=/\\textsf|\\textbf/.test(tex);return `<span class="math${boldSans?' math-label':''}">${escapeHTML(plain)}</span>`;}
function math(tex){tex=String(tex);if(!window.MathJax?.tex2svg)return fallbackMath(tex);try{if(!mathCache.has(tex)){if(mathCache.size>5000)mathCache.clear();const node=MathJax.tex2svg(tex,{display:false});if(node.querySelector?.('[data-mml-node="merror"]'))return fallbackMath(tex);mathCache.set(tex,node.outerHTML);}return `<span class="math">${mathCache.get(tex)}</span>`;}catch{return fallbackMath(tex);}}
window.addEventListener('math-ready',()=>{mathCache.clear();document.querySelectorAll('[data-tex]').forEach(el=>el.innerHTML=math(el.dataset.tex));if(events.length){render();}});

let R,C,N,events=[],at=0,parent=[],weight=[],passages=[],considered=0,shortened=0,components=0,makeCount=0,findCount=0,unionCount=0,timer=null,search=null,robotFrame=null;
function makeTrace(rows,cols,random=Math.random){
 const n=rows*cols,p=Array.from({length:n},(_,i)=>i),w=Array(n).fill(1),walls=[],out=[{kind:'init'}];let count=n;
 for(let a=0;a<n;a++){if(a%cols<cols-1)walls.push([a,a+1]);if(a+cols<n)walls.push([a,a+cols]);}
 for(let i=walls.length-1;i>0;i--){const j=Math.floor(random()*(i+1));[walls[i],walls[j]]=[walls[j],walls[i]];}
 function find(x,changes){let r=x;while(p[r]!==r)r=p[r];while(p[x]!==x){const next=p[x];if(p[x]!==r){changes.push([x,r]);p[x]=r;}x=next;}return r;}
 for(const edge of walls){const changes=[],[a,b]=edge;let ra=find(a,changes),rb=find(b,changes);const event={kind:'wall',edge,parentChanges:changes,callFind:2,shorten:changes.length};
  if(ra!==rb){if(w[ra]<w[rb]||(w[ra]===w[rb]&&ra>rb))[ra,rb]=[rb,ra];p[rb]=ra;changes.push([rb,ra]);w[ra]+=w[rb];count--;event.weightChange=[ra,w[ra]];event.carve=edge;event.merge=1;}
  out.push(event);if(count===1)break;
 }
 return out;
}
function root(x){while(parent[x]!==x)x=parent[x];return x;}
function color(r){return `hsl(${(r*137.50776405)%360} ${52+(Math.floor(r/11)%3)*7}% ${77+(Math.floor(r/7)%3)*4}%)`;}
function resetState(){parent=Array.from({length:N},(_,i)=>i);weight=Array(N).fill(1);passages=[];considered=0;shortened=0;components=N;makeCount=N;findCount=0;unionCount=0;}
function apply(e){findCount+=e.callFind||0;unionCount+=e.merge||0;for(const[u,v]of e.parentChanges||[])parent[u]=v;if(e.weightChange)weight[e.weightChange[0]]=e.weightChange[1];if(e.carve)passages.push(e.carve);if(e.merge)components--;if(e.kind==='wall')considered++;shortened+=e.shorten||0;}
function pause(){clearTimeout(timer);timer=null;$('play').textContent='▶ Play';}
function seek(i){pause();clearPath();at=Math.max(0,Math.min(events.length-1,i));resetState();for(let j=1;j<=at;j++)apply(events[j]);render();}
function advance(){clearPath();if(at<events.length-1){apply(events[++at]);render();}}
function traceAt(){return at;}
function traceLength(){return events.length;}
function tick(){if(traceAt()>=traceLength()-1){pause();return;}advance();if(traceAt()===traceLength()-1){pause();return;}timer=setTimeout(tick,650);}
function play(){if(timer!==null){pause();return;}if(traceAt()===traceLength()-1)seek(0);$('play').textContent='Ⅱ Pause';timer=setTimeout(tick,650);}
function build(){pause();if(!$('settings').reportValidity())return;clearPath();R=Number($('rows').value);C=Number($('cols').value);N=R*C;events=makeTrace(R,C);$('timeline').max=events.length-1;at=0;resetState();render();}
function resetGrid(){pause();clearPath();at=0;$('rows').value=R;$('cols').value=C;resetState();render();}
function draw(){const canvas=$('maze'),ctx=canvas.getContext('2d'),cell=44,pad=20,W=C*cell+2*pad,H=R*cell+2*pad,dpr=window.devicePixelRatio||1;canvas.width=W*dpr;canvas.height=H*dpr;canvas.style.aspectRatio=`${W} / ${H}`;ctx.scale(dpr,dpr);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);let e=search||at===events.length-1?{}:events[at];for(let a=0;a<N;a++){let x=pad+(a%C)*cell,y=pad+Math.floor(a/C)*cell;ctx.fillStyle=color(root(a));ctx.fillRect(x,y,cell,cell);}
const open=new Set(passages.map(([a,b])=>a+':'+b));ctx.strokeStyle='#77878c';ctx.lineWidth=1;ctx.beginPath();function line(x,y,x2,y2){ctx.moveTo(x,y);ctx.lineTo(x2,y2);}for(let r=0;r<R;r++)for(let c=0;c<C;c++){let a=r*C+c,x=pad+c*cell,y=pad+r*cell;if(r===0&&c!==0)line(x,y,x+cell,y);if(c===0)line(x,y,x,y+cell);if(c===C-1||!open.has(a+':'+(a+1)))line(x+cell,y,x+cell,y+cell);if(r===R-1?c!==C-1:!open.has(a+':'+(a+C)))line(x,y+cell,x+cell,y+cell);}ctx.stroke();
if(e.edge){let[a,b]=e.edge,x=pad+(a%C)*cell,y=pad+Math.floor(a/C)*cell;ctx.beginPath();ctx.setLineDash([6,4]);ctx.lineWidth=4;ctx.strokeStyle='#000';if(b===a+1)line(x+cell,y+3,x+cell,y+cell-3);else line(x+3,y+cell,x+cell-3,y+cell);ctx.stroke();ctx.setLineDash([]);}
let labels=[];for(let a=0;a<N;a++)labels.push(`<span class="cell-id" style="left:${100*(pad+(a%C)*cell+cell-4)/W}%;top:${100*(pad+Math.floor(a/C)*cell+cell-4)/H}%">${math(a+1)}</span>`);if(e.edge)for(let id of e.edge)labels.push(`<span class="endpoint" style="left:${100*(pad+(id%C)*cell+cell/2)/W}%;top:${100*(pad+Math.floor(id/C)*cell+cell/2)/H}%">★</span>`);labels.push(`<span class="maze-marker" style="left:${100*(pad+cell/2)/W}%;top:${100*(pad/2)/H}%">${math('\\textsf{\\textbf{START}}')}</span>`);labels.push(`<span class="maze-marker" style="left:${100*(pad+(C-0.5)*cell)/W}%;top:${100*(pad+R*cell+pad/2)/H}%">${math('\\textsf{\\textbf{END}}')}</span>`);$('cellLabels').innerHTML=labels.join('');
if(search)drawSearch(ctx,cell,pad);positionRobot();
}
function render(){$('makeCount').textContent=makeCount;$('findCount').textContent=findCount;$('unionCount').textContent=unionCount;$('setCount').textContent=components;$('wallCount').textContent=considered;$('timeline').value=at;$('position').innerHTML=math(`${at} / ${events.length-1}`);$('back').disabled=at===0;for(let id of ['wall','finish'])$(id).disabled=at===events.length-1;let groups=new Map();for(let i=0;i<N;i++){let r=root(i);if(!groups.has(r))groups.set(r,[]);groups.get(r).push(i);}$('sets').innerHTML=[...groups].sort((a,b)=>a[0]-b[0]).map(([r,m])=>`<div class="set" style="--color:${color(r)}"><div class="members">${math('\\{')}${m.map((v,i)=>math(String(v+1)+(i<m.length-1?',':''))).join('')}${math('\\}')}</div></div>`).join('');renderSearch();draw();}
function findPath(n,edges){const adj=Array.from({length:n},()=>[]);for(const[a,b]of edges){adj[a].push(b);adj[b].push(a);}const pred=Array(n).fill(-1),seen=new Set([0]),queue=[0];for(let head=0;head<queue.length;head++){const v=queue[head];if(v===n-1){const path=[];for(let u=v;u!==-1;u=pred[u])path.push(u);return path.reverse();}for(let u of adj[v])if(!seen.has(u)){seen.add(u);pred[u]=v;queue.push(u);}}return [];}
function clearPath(){if(robotFrame!==null)cancelAnimationFrame(robotFrame);robotFrame=null;search=null;$('robot').hidden=true;$('robot').setAttribute('data-arrived','false');$('robot').setAttribute('aria-label','Robot following the solution path');}
function startSearch(){if(at!==events.length-1||components!==1)return;pause();clearPath();const path=findPath(N,passages);search={path,progress:0,startedAt:null,duration:Math.min(20000,Math.max(1600,(path.length-1)*160))};render();if(path.length)robotFrame=requestAnimationFrame(moveRobot);}
function renderSearch(){$('bfs').disabled=at!==events.length-1||components!==1;$('bfs').setAttribute('aria-pressed',String(!!search));$('timeline').max=events.length-1;}
function positionRobot(){const robot=$('robot');if(!search?.path.length){robot.hidden=true;return;}const path=search.path,progress=Math.min(path.length-1,search.progress),i=Math.floor(progress),t=progress-i,a=path[i],b=path[Math.min(i+1,path.length-1)],x=(a%C)+(b%C-a%C)*t,y=Math.floor(a/C)+(Math.floor(b/C)-Math.floor(a/C))*t,W=C*44+40,H=R*44+40;robot.hidden=false;robot.style.left=100*(20+(x+0.5)*44)/W+'%';robot.style.top=100*(20+(y+0.5)*44)/H+'%';robot.style.width=100*32/W+'%';}
function celebrateRobot(){$('robot').setAttribute('data-arrived','true');$('robot').setAttribute('aria-label','Robot reached END and is smiling, winking, and doing a victory dance');}
function moveRobot(timestamp){robotFrame=null;if(!search?.path.length)return;if(search.startedAt===null)search.startedAt=timestamp;const fraction=Math.min(1,Math.max(0,(timestamp-search.startedAt)/search.duration));search.progress=fraction*(search.path.length-1);positionRobot();if(fraction<1)robotFrame=requestAnimationFrame(moveRobot);else celebrateRobot();}
function drawSearch(ctx,cell,pad){const e=search,point=v=>[pad+(v%C)*cell+cell/2,pad+Math.floor(v/C)*cell+cell/2];if(e.path.length){ctx.beginPath();for(let[i,v]of e.path.entries()){let[x,y]=point(v);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='rgba(255,255,255,0.95)';ctx.lineWidth=9;ctx.stroke();ctx.strokeStyle='#7c3aed';ctx.lineWidth=5;ctx.stroke();ctx.lineCap='butt';for(let v of [e.path[0],e.path[e.path.length-1]]){let[x,y]=point(v);ctx.fillStyle='#7c3aed';ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();}}}
$('generate').onclick=build;$('reset').onclick=resetGrid;$('settings').onsubmit=e=>{e.preventDefault();build();};$('play').onclick=play;$('back').onclick=()=>seek(traceAt()-1);$('finish').onclick=()=>seek(traceLength()-1);$('wall').onclick=()=>{pause();advance();};$('bfs').onclick=startSearch;$('timeline').oninput=e=>seek(Number(e.target.value));document.addEventListener('keydown',e=>{if(['INPUT','BUTTON','SELECT','TEXTAREA','SUMMARY'].includes(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();play();}if(e.code==='ArrowRight'){e.preventDefault();pause();advance();}if(e.code==='ArrowLeft'){e.preventDefault();seek(traceAt()-1);}});build();
</script></body></html>
